<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI News — Latest AI headlines</title>
<script>
// Apply saved/system theme before first paint to avoid flash
(function () {
  try {
    var t = localStorage.getItem("theme");
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #f3f6fb;
    --panel: #ffffff;
    --panel2: #eef2f8;
    --border: #dde4ef;
    --text: #1c2733;
    --muted: #5b6b7f;
    --accent: #2563eb;
    --accent2: #7c3aed;
    --badge: #e8eefb;
    --header-bg: rgba(255, 255, 255, 0.92);
  }
  [data-theme="dark"] {
    --bg: #0b1220;
    --panel: #111a2c;
    --panel2: #1a2540;
    --border: #24334f;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent2: #a78bfa;
    --badge: #1e2a45;
    --header-bg: rgba(10, 18, 32, 0.92);
  }
  html { font-size: 110%; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .logo {
    font-size: 1.25rem; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap;
  }
  .logo span { color: var(--muted); font-weight: 400; font-size: 0.8125rem; -webkit-text-fill-color: var(--muted); }
  .controls { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  input[type="search"], select {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 0.875rem; outline: none;
  }
  input[type="search"]:focus, select:focus { border-color: var(--accent); }
  button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 0.875rem; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .theme-toggle {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 0.875rem; line-height: 1; cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  /* --- Live badge --- */
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px;
    font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted);
    text-transform: uppercase;
  }
  .live-badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.8);
    animation: pulse-dot 1.6s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.55; }
  }

  /* --- News ticker --- */
  .ticker-wrap {
    position: relative;
    border-bottom: 1px solid var(--border);
    background: var(--panel2);
    overflow: hidden; white-space: nowrap;
    padding: 6px 0;
  }
  .ticker-wrap::before,
  .ticker-wrap::after {
    content: ""; position: absolute; top: 0; bottom: 0;
    width: 56px; z-index: 1; pointer-events: none;
  }
  .ticker-wrap::before { left: 0; background: linear-gradient(90deg, var(--panel2), transparent); }
  .ticker-wrap::after { right: 0; background: linear-gradient(270deg, var(--panel2), transparent); }
  .ticker {
    display: inline-block;
    will-change: transform;
    animation: ticker-scroll 60s linear infinite;
  }
  .ticker span {
    display: inline-block; padding: 0 28px;
    font-size: 0.78125rem; color: var(--muted);
  }
  .ticker span::before {
    content: "●"; color: var(--accent); margin-right: 8px; font-size: 0.5rem;
    vertical-align: middle;
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* --- Scanning line under header --- */
  #refresh-progress {
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    background-size: 200% 100%;
    animation: scanline 2.4s linear infinite;
    opacity: 0.7;
  }
  @keyframes scanline {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  /* --- Scanner status --- */
  .scanner { display: inline-block; }
  .scanner .radar {
    position: relative; width: 72px; height: 72px; margin: 0 auto 16px;
    border-radius: 50%; border: 2px solid var(--border);
    overflow: hidden; background: var(--panel2);
  }
  .scanner .radar::before {
    content: ""; position: absolute; inset: 0;
    background: conic-gradient(from 0deg, color-mix(in srgb, var(--accent) 45%, transparent) 0deg, transparent 75deg);
    animation: spin 1.2s linear infinite;
  }
  .scanner .radar::after {
    content: ""; position: absolute; inset: 18%;
    border-radius: 50%; border: 1px dashed var(--border);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scanner .scan-msg { font-size: 0.8125rem; }

  /* --- Skeleton loaders --- */
  .skeleton {
    border-radius: 12px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--border);
  }
  .sk-img {
    height: 150px;
    background: linear-gradient(90deg, var(--panel2) 25%, var(--border) 50%, var(--panel2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  .sk-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .sk-line {
    height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, var(--panel2) 25%, var(--border) 50%, var(--panel2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  .sk-line.short { width: 60%; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* --- Card entrance + NEW badge --- */
  .card { animation: fadeUp 0.45s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge-new {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: #fff;
    animation: badge-pulse 1.6s ease-in-out infinite;
  }
  @keyframes badge-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
    50% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .meta { color: var(--muted); font-size: 0.8125rem; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.10); }
  .card img { width: 100%; height: 150px; object-fit: cover; background: var(--panel2); }
  .card .body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h2 { font-size: 0.9375rem; font-weight: 600; line-height: 1.35; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); }
  .card p { color: var(--muted); font-size: 0.8125rem; flex: 1; }
  .card .foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.75rem; color: var(--muted);
  }
  .badge {
    background: var(--badge); color: var(--text);
    border-radius: 999px; padding: 2px 10px; font-size: 0.6875rem; font-weight: 600;
  }
  #status { text-align: center; padding: 40px; color: var(--muted); }
  #empty { display: none; text-align: center; padding: 40px; color: var(--muted); }
  .error { color: #ff6b6b; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 24px; }
</style>
</head>
<body>
<header>
  <div class="logo">⚡ AI News <span>latest headlines</span></div>
  <div class="live-badge" title="Feed is live — scrapes hourly via GitHub Actions"><span class="dot"></span> Live</div>
  <div class="controls">
    <input type="search" id="search" placeholder="Search headlines..." autocomplete="off">
    <select id="source-filter"><option value="">All sources</option></select>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark/light mode">🌙</button>
    <span class="meta" id="updated-badge" title="Auto-refreshes hourly via GitHub Actions">● auto-updates hourly</span>
  </div>
</header>

<div class="ticker-wrap" id="ticker-wrap" hidden><div class="ticker" id="ticker"></div></div>
<div id="refresh-progress"></div>

<main>
  <div id="status">
    <div class="scanner">
      <div class="radar"></div>
      <div class="scan-msg" id="scan-msg">Connecting to sources…</div>
    </div>
  </div>
  <div id="empty">No articles match your filters.</div>
  <div id="grid"></div>
  <footer>
    <span id="meta" class="meta"></span>
    <div class="meta" style="margin-top:6px">Auto-updates hourly via GitHub Actions · served by GitHub Pages</div>
    <div class="meta" style="margin-top:10px">Developed by <a href="https://nipuna.netlify.app/" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">Nipuna Gomes</a></div>
  </footer>
</main>

<script>
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const sourceEl = document.getElementById("source-filter");
const metaEl = document.getElementById("meta");
const tickerWrapEl = document.getElementById("ticker-wrap");
const tickerEl = document.getElementById("ticker");
const updatedBadgeEl = document.getElementById("updated-badge");
const scanMsgEl = document.getElementById("scan-msg");

let news = [];

function timeAgo(ts) {
  if (!ts) return "";
  const diff = Date.now() / 1000 - ts;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + "d ago";
  return new Date(ts * 1000).toLocaleDateString();
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const src = sourceEl.value;
  const all = news.items || [];
  const items = all.filter(it =>
    (!q || (it.title + " " + (it.summary || "")).toLowerCase().includes(q)) &&
    (!src || it.source === src)
  );
  grid.innerHTML = "";
  statusEl.style.display = "none";
  emptyEl.style.display = items.length ? "none" : "block";

  for (let idx = 0; idx < items.length; idx++) {
    const it = items[idx];
    const card = document.createElement("article");
    card.className = "card";
    card.style.animationDelay = Math.min(idx * 40, 480) + "ms";
    const img = it.image
      ? `<img src="${it.image}" alt="" loading="lazy" onerror="this.remove()">`
      : "";
    const fresh = it.timestamp && (Date.now() / 1000 - it.timestamp) < 3600;
    card.innerHTML = `
      ${img}
      <div class="body">
        <h2><a href="${it.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title)}</a></h2>
        ${it.summary ? `<p>${escapeHtml(it.summary)}</p>` : ""}
        <div class="foot">
          <span class="badge">${escapeHtml(it.source)}</span>
          <span>${fresh ? '<span class="badge badge-new">NEW</span> ' : ''}${timeAgo(it.timestamp)}</span>
        </div>
      </div>`;
    grid.appendChild(card);
  }
  metaEl.textContent = items.length
    ? `Showing ${items.length} article${items.length === 1 ? "" : "s"} · scraped ${news.scraped_at ? new Date(news.scraped_at).toLocaleString() : "—"}`
    : "";
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

const SCRAPE_MSGS = [
  "Connecting to sources",
  "Fetching RSS feeds",
  "Parsing headlines",
  "Extracting summaries",
  "Indexing articles",
  "Finalizing feed"
];
let scrapeTimer = null;

function formatTime(s) {
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function showScanner() {
  statusEl.style.display = "block";
  statusEl.className = "";
  emptyEl.style.display = "none";
  let i = 0;
  scanMsgEl.textContent = SCRAPE_MSGS[0] + "…";
  clearInterval(scrapeTimer);
  scrapeTimer = setInterval(() => {
    i = (i + 1) % SCRAPE_MSGS.length;
    scanMsgEl.textContent = SCRAPE_MSGS[i] + "…";
  }, 380);
}

function hideScanner() {
  clearInterval(scrapeTimer);
  statusEl.style.display = "none";
}

function showSkeletons(n) {
  grid.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div");
    s.className = "skeleton";
    s.innerHTML = '<div class="sk-img"></div><div class="sk-body">' +
      '<div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line"></div></div>';
    grid.appendChild(s);
  }
}

function buildTicker(items) {
  if (!items.length) { tickerWrapEl.hidden = true; return; }
  const html = items.map(it => `<span>${escapeHtml(it.title)}</span>`).join("");
  tickerEl.innerHTML = html + html;
  tickerWrapEl.hidden = false;
  // Steady TV-news pace (~140px/s) regardless of how many headlines there are
  const half = tickerEl.scrollWidth / 2;
  if (half > 0) tickerEl.style.animationDuration = (half / 140) + "s";
}

async function load(showFullScrape) {
  if (showFullScrape) { showScanner(); showSkeletons(8); }
  const res = await fetch("news.json");
  news = await res.json();
  const sources = [...new Set(news.items.map(it => it.source))].sort();
  const current = sourceEl.value;
  sourceEl.innerHTML = '<option value="">All sources</option>' +
    sources.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  sourceEl.value = current;
  render();
  buildTicker(news.items || []);
  if (showFullScrape) hideScanner();
}

searchEl.addEventListener("input", render);
sourceEl.addEventListener("change", render);

// --- Dark / light theme toggle ---
const themeToggle = document.getElementById("theme-toggle");
const rootEl = document.documentElement;
function applyTheme(theme) {
  rootEl.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
  themeToggle.setAttribute("title", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
  themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
}
applyTheme(rootEl.getAttribute("data-theme") === "dark" ? "dark" : "light");
themeToggle.addEventListener("click", () => {
  const next = rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});

load(true).catch(e => {
  hideScanner();
  statusEl.style.display = "block";
  statusEl.className = "error";
  statusEl.textContent = "Failed to load news: " + e.message;
});

// Countdown + pick up freshly scraped data (news.json committed hourly by GitHub Actions)
const REFRESH_SECONDS = 300;
let refreshLeft = REFRESH_SECONDS;
updatedBadgeEl.textContent = "⏳ next scrape in " + formatTime(refreshLeft);
setInterval(() => {
  refreshLeft--;
  if (refreshLeft <= 0) {
    refreshLeft = REFRESH_SECONDS;
    load(false).catch(() => {});
  }
  updatedBadgeEl.textContent = "⏳ next scrape in " + formatTime(refreshLeft);
}, 1000);
</script>
</body>
</html>
