name: Scrape AI News

on:
  schedule:
    # Every hour at minute 17 (UTC) — GitHub Actions cron uses UTC
    - cron: "17 * * * *"
  workflow_dispatch: # lets you trigger a scrape manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated news.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes — news.json is already up to date."
          else
            git commit -m "chore: refresh AI news [skip ci]"
            git push
          fi
